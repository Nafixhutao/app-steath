services:
  postgres:
    image: postgres:16-alpine
    container_name: stealth-postgres
    environment:
      POSTGRES_USER: stealth
      POSTGRES_PASSWORD: stealth_dev_password
      POSTGRES_DB: stealth_hosting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stealth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
