services:
  postgres:
    image: postgres:16-alpine
    container_name: stealth-postgres
    environment:
      POSTGRES_USER: stealth
      POSTGRES_PASSWORD: stealth_dev_password
      POSTGRES_DB: stealth_hosting
    # Bound to loopback on purpose: the dev password is a well-known constant, so
    # publishing on 0.0.0.0 would hand a database to anything that can reach the
    # host. Only this machine needs it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stealth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Caddy serves every Platform Subdomain. The Node Agent programs it through the
  # admin API and joins it to each Project network, which is how it resolves the
  # `svc-...` alias of a Service. `local_certs` uses Caddy's internal CA so the
  # `<ip>.nip.io` hostnames get HTTPS without public DNS or an ACME account.
  caddy:
    image: caddy:2-alpine
    container_name: stealth-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # The admin API can rewrite any route without authentication, so it is
      # loopback-only: the Agent runs on this host and is the only client.
      - "127.0.0.1:2019:2019"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Caddy asks the Control Plane before issuing a certificate. On Docker
    # Desktop this name already exists; the mapping makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Shared object storage for the Storage feature. No published port: the Agent
  # reaches minio:9000 over the Compose network and Caddy serves the public S3
  # hostname. Pinned to a MinIO-compatible fork because the official images
  # were withdrawn from the public registries in 2026.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: stealth-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stealthminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stealth_dev_minio_password}
    volumes:
      - minio_data:/data

  # Runs the Agent in a container when needed with
  # `docker compose --profile agent up -d agent`. The default dev flow still
  # runs it on the host with `npm run agent:run`, so this stays profile-gated.
  agent:
    profiles: ["agent"]
    image: stealth-agent:local
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: stealth-agent
    restart: unless-stopped
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:-change-me}
      AGENT_ADDR: ":8081"
      AGENT_NAME: ${AGENT_NAME:-node-1}
      AGENT_WORK_DIR: /var/lib/stealth-agent
      CADDY_ADMIN_URL: http://caddy:2019
      CADDY_CONTAINER_NAME: stealth-caddy
      AGENT_PROBE_IMAGE: busybox:1.36
      TRIVY_BIN: /usr/local/bin/trivy
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stealthminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stealth_dev_minio_password}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_work:/var/lib/stealth-agent
    depends_on:
      - caddy
      - minio

volumes:
  postgres_data:
  minio_data:
  agent_work:
  caddy_data:
  caddy_config:
