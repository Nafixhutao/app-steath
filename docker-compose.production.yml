# Production stack for a single VPS.
#
#   docker compose -f docker-compose.production.yml up -d --build
#
# Only Caddy and the Cloudflare Tunnel are reachable from outside, and even they
# publish no host port: the tunnel dials `caddy:443` over the Compose network.
# PostgreSQL, the Control Plane, the worker and the Node Agent stay on the
# internal network. The agent is the only process with the Docker socket.
#
# Values come from `.env` next to this file; see `.env.example` for the keys.

name: stealth

x-app: &app
  image: stealth-app:${STEALTH_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # Inlined into the browser bundle at build time, so it must be the public
      # origin rather than a runtime value.
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL}
  env_file:
    - .env
  environment:
    NODE_ENV: production
    PLATFORM_DB_CONTAINER: stealth-postgres
    # The worker writes a Backup here and the Control Plane reads it back for a
    # download, so both mount the same Volume. Without it the fallback would use
    # `$PWD/backups`, which the runtime user cannot create.
    BACKUP_LOCAL_DIR: /app/backups
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: stealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stealth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stealth_hosting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stealth -d stealth_hosting"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Runs once per `up`. The migration runner takes a PostgreSQL advisory lock, so
  # a second invocation (or a restart loop) cannot apply the same migration twice.
  migrate:
    <<: *app
    command: ["node", "scripts/migrate.mts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    <<: *app
    volumes:
      - backups_data:/app/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    <<: *app
    command: ["node", "worker/index.mts"]
    volumes:
      - backups_data:/app/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      # The worker queues the daily Backups as soon as it starts, and each one is
      # an Agent call, so the Agent has to be up first.
      agent:
        condition: service_started

  agent:
    image: stealth-agent:${STEALTH_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: stealth-agent
    restart: unless-stopped
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN}
      AGENT_ADDR: ":8081"
      AGENT_NAME: ${AGENT_NAME:-node-1}
      AGENT_WORK_DIR: /var/lib/stealth-agent
      CONTROL_PLANE_URL: http://control-plane:3000
      CADDY_ADMIN_URL: http://caddy:2019
      CADDY_CONTAINER_NAME: stealth-caddy
      AGENT_PROBE_IMAGE: busybox:1.36
      TRIVY_BIN: /usr/local/bin/trivy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_work:/var/lib/stealth-agent
    depends_on:
      control-plane:
        condition: service_healthy
      # The Agent programs Caddy as soon as it starts (Reconcile + the on-demand
      # TLS ask URL), so Caddy must already be answering on its admin API.
      caddy:
        condition: service_healthy
    # No ports. The Control Plane reaches the agent as `agent:8081` and every
    # request carries the bearer token.

  caddy:
    image: caddy:2-alpine
    container_name: stealth-caddy
    restart: unless-stopped
    volumes:
      - ./infra/caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Cloudflare terminates public TLS and forwards by Host header. Two ingress
  # rules are configured in the Cloudflare dashboard, because a token-managed
  # tunnel keeps its config there:
  #
  #   console.<domain>      -> http://control-plane:3000
  #   *.<platform-domain>   -> https://caddy:443   (No TLS Verify)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: stealth-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

volumes:
  postgres_data:
  backups_data:
  caddy_data:
  caddy_config:
  agent_work:
