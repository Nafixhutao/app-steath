name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stealth
          POSTGRES_PASSWORD: stealth_dev_password
          POSTGRES_DB: stealth_hosting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stealth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://stealth:stealth_dev_password@localhost:5432/stealth_hosting_test

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify contract and run test suite
        run: npm run ci

      - name: Check contract compatibility
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
        run: npm run contract:breaking
